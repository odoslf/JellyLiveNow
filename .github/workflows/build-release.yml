name: Build, validate & release JellyLiveNow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.0.2.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore plugin dependencies
        run: dotnet restore JellyLiveNow/JellyLiveNow.csproj

      - name: Restore test dependencies
        run: dotnet restore JellyLiveNow.Tests/JellyLiveNow.Tests.csproj

      - name: Build plugin with warnings as errors
        run: dotnet build JellyLiveNow/JellyLiveNow.csproj -c Release --no-restore --warnaserror

      - name: Run unit tests
        run: dotnet test JellyLiveNow.Tests/JellyLiveNow.Tests.csproj -c Release --no-restore

      - name: Audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet list JellyLiveNow/JellyLiveNow.csproj package --vulnerable --include-transitive | tee vulnerability-audit.txt
          if grep -Eiq 'has the following vulnerable packages|\b(Critical|High|Moderate|Low)\b' vulnerability-audit.txt; then
            echo 'Vulnerable dependency detected.' >&2
            exit 1
          fi

      - name: Package verified plugin
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir -p publish/plugin
          cp JellyLiveNow/bin/Release/net8.0/JellyLiveNow.dll publish/plugin/
          cd publish/plugin
          zip -9 "../../JellyLiveNow_${VERSION}.zip" JellyLiveNow.dll
          cd ../..
          unzip -t "JellyLiveNow_${VERSION}.zip"
          test "$(unzip -Z1 "JellyLiveNow_${VERSION}.zip" | wc -l)" -eq 1
          test "$(unzip -Z1 "JellyLiveNow_${VERSION}.zip")" = "JellyLiveNow.dll"

      - name: Start official Jellyfin 10.10.7 with packaged plugin
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime
          mkdir -p "runtime/config/plugins/JellyLiveNow_${VERSION}" runtime/cache artifacts
          unzip -q "JellyLiveNow_${VERSION}.zip" -d "runtime/config/plugins/JellyLiveNow_${VERSION}"
          chmod -R a+rwX runtime
          docker pull jellyfin/jellyfin:10.10.7
          docker run -d --name jellylivenow-e2e \
            -p 8096:8096 \
            -v "$PWD/runtime/config:/config" \
            -v "$PWD/runtime/cache:/cache" \
            jellyfin/jellyfin:10.10.7
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8096/System/Info/Public >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8096/System/Info/Public >/dev/null
          docker logs jellylivenow-e2e > artifacts/jellyfin-10.10.7-runtime.log 2>&1
          grep -q "Loaded plugin: JellyLiveNow ${VERSION}" artifacts/jellyfin-10.10.7-runtime.log
          if grep -E '\[ERR\].*JellyLiveNow|JellyLiveNow.*\[ERR\]' artifacts/jellyfin-10.10.7-runtime.log; then
            echo 'JellyLiveNow emitted an error in Jellyfin runtime.' >&2
            exit 1
          fi

      - name: Stop runtime container
        if: always() && github.event_name != 'pull_request'
        run: docker rm -f jellylivenow-e2e || true

      - name: Calculate MD5
        if: github.event_name != 'pull_request'
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s "JellyLiveNow_${VERSION}.zip"
          MD5_HASH=$(md5sum "JellyLiveNow_${VERSION}.zip" | awk '{print $1}')
          echo "checksum=$MD5_HASH" >> "$GITHUB_OUTPUT"

      - name: Publish release and repository manifest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          MD5_HASH: ${{ steps.checksum.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          p = 'manifest.json'
          with open(p, encoding='utf-8') as f:
              data = json.load(f)
          current = next(v for v in data[0]['versions'] if v['version'] == os.environ['VERSION'])
          current['checksum'] = os.environ['MD5_HASH']
          data[0]['versions'] = [current]
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- manifest.json; then
            git add manifest.json
            git commit -m "release: finalize ${VERSION} checksum [skip ci]"
            git push origin HEAD:main
          fi
          TAG="v${VERSION}"
          PACKAGE="JellyLiveNow_${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --clobber
          else
            gh release create "$TAG" "$PACKAGE" --target main --title "JellyLiveNow ${VERSION}" --notes "Jellyfin 10.10.7 / .NET 8. Validado cargando el plugin en el servidor oficial, además de build, tests, auditoría y empaquetado. Canal nativo IChannel para detectar una emisión Live TV activa y resolver sus fuentes dinámicas de reproducción."
          fi

      - name: Upload validation evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: JellyLiveNow-${{ env.VERSION }}-validation
          path: |
            artifacts/jellyfin-10.10.7-runtime.log
            vulnerability-audit.txt
          if-no-files-found: warn
