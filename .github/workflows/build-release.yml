name: Build & Release JellyLiveNow

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore plugin dependencies
        run: dotnet restore JellyLiveNow/JellyLiveNow.csproj
      - name: Restore test dependencies
        run: dotnet restore JellyLiveNow.Tests/JellyLiveNow.Tests.csproj
      - name: Build plugin
        run: dotnet build JellyLiveNow/JellyLiveNow.csproj -c Release --no-restore
      - name: Run unit tests
        run: dotnet test JellyLiveNow.Tests/JellyLiveNow.Tests.csproj -c Release --no-restore
      - name: Package plugin ZIP
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p publish
          dotnet publish JellyLiveNow/JellyLiveNow.csproj -c Release -o publish/plugin --no-restore
          cd publish/plugin
          zip -r ../../JellyLiveNow_1.0.1.0.zip .
      - name: Validate ZIP and calculate MD5
        if: startsWith(github.ref, 'refs/tags/')
        id: checksum
        run: |
          test -f JellyLiveNow_1.0.1.0.zip
          MD5_HASH=$(md5sum JellyLiveNow_1.0.1.0.zip | awk '{ print $1 }')
          echo "checksum=$MD5_HASH" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: JellyLiveNow_1.0.1.0.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## JellyLiveNow 1.0.1.0
            - Registers the native IChannel provider correctly in Jellyfin DI.
            - Resolves Live TV through Jellyfin playback media-source providers.
            - CI builds both plugin and tests before release.
            - Target: Jellyfin 10.10.7 / .NET 8.
            - MD5: `${{ steps.checksum.outputs.checksum }}`
          draft: false
          prerelease: false
